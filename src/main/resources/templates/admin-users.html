<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>JustDoIt! - Administración de usuarios</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
</head>

<body>

<div class="container">

    <!-- Left column -->
    <aside class="sidebar">

        <!-- Logo area -->
        <div class="logo">
            <a th:href="@{/}"><img th:src="@{/images/JustDoIt.png}" alt="JustDoIt Logo" width="200" height="200"></a>
        </div>

        <!-- Navigation area -->
        <nav class="navigation">
            <h3>Opciones</h3>
            <ul>
                <li>
                    <a th:href="@{/admin}">Inicio</a>
                </li>
                <li>
                    <strong>Administración de usuarios</strong>
                </li>
                <li>
                    <a th:href="@{/user/tasks}">Tareas de usuario actual</a>
                </li>
                <li>
                    <form th:action="@{/logout}" method="post" style="display:inline">
                        <button type="submit" class="link-button">Cerrar sesión</button>
                    </form>
                </li>
            </ul>
        </nav>

    </aside>

    <!-- Right column -->
    <main class="content">
        <h1>Administración de usuarios</h1>

        <div th:if="${param.success}" class="success-message">
            Usuario creado exitosamente.
        </div>

        <form class="login-form" th:action="@{/admin/users}" th:object="${newUser}" method="post">
            <div>
                <label for="userName">Username</label>
                <input type="text" id="userName" name="userName" required />
            </div>
            <div>
                <label for="password">Password</label>
                <input type="password" id="password" th:field="*{password}" required />
            </div>
            <div>
                <label for="name">Nombre</label>
                <input type="text" id="name" th:field="*{name}" required />
            </div>
            <div>
                <label for="email">Correo</label>
                <input type="email" id="email" th:field="*{email}" required />
            </div>
            <div>
                <label for="type">Tipo</label>
                <select id="type" th:field="*{type}" required>
                    <option value="">-- Seleccione --</option>
                    <option th:value="'REGULAR'">Regular</option>
                    <option th:value="'ADMIN'">Admin</option>
                </select>
            </div>
            <button type="submit">Crear usuario</button>
        </form>
    </main>

</div>

</body>
</html>
